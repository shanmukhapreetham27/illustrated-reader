<!doctype html>

<body>
<title>Metamorphosis, Illustrated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&amp;family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
<style>
/* Layout: one paginated column, KOReader-style. Text flows through CSS columns that are
   exactly one page wide; turning a page shifts the strip by one column. Chrome (footer,
   buttons, dialogs) copies KOReader's native look: bordered, rounded, bold sans. */
:root {
  --paper: #fdfcfa;
  --ink: #1c1a17;
  --muted: #736d65;
  --rule: #d7d1c7;
  --accent: #a2660f;
  --accent-ink: #ffffff;
  --chrome: #ffffff;
  --chrome-ink: #1c1a17;
  --sel: rgba(28, 26, 23, .09);
  --ground: rgba(162, 102, 15, .17);
  --scan: rgba(162, 102, 15, .30);
  --flash: rgba(162, 102, 15, .14);

  --fig-bg: #f3f1ec;
  --fig-ink: #2a2622;
  --fig-muted: #6e675e;
  --fig-w1: #e9e5dd;
  --fig-w2: #d5cfc3;
  --fig-w3: #5c554c;
  --fig-face: #fffdf9;
  --fig-floor: #ddd3c2;
  --fig-wood: #b98d5f;
  --fig-wood2: #c9a072;
  --fig-linen: #f8f6f1;
  --fig-shell: #3f2a1c;
  --fig-belly: #9a6532;
  --fig-blanket: #6f8297;
  --fig-ochre: #c8902e;
  --fig-ochre2: #e2b866;
  --fig-fur: #6b513e;
  --fig-sky: #a8b0b5;
  --fig-fog: #c3c9cc;
  --fig-rain: #56636c;
  --fig-drop: #d9e0e3;
  --fab1: #c8902e;
  --fab2: #5b7088;
  --fab3: #9b4f3c;
  --fab4: #7d8b62;

  --ui: "Noto Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --serif: "Literata", "Charis SIL", Georgia, serif;
  --fs: 18px;
  --mt: 22px;
  --foot: 46px;
}
@media (min-width: 700px) {
  :root { --serif: "Charis SIL", "Literata", Georgia, serif; --mt: 30px; --foot: 52px; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121110; --ink: #e7e2d9; --muted: #9c958b; --rule: #3a3631; --accent: #e3a94f; --accent-ink: #1b1306;
    --chrome: #1b1a18; --chrome-ink: #e7e2d9; --sel: rgba(231, 226, 217, .12); --ground: rgba(227, 169, 79, .22);
    --scan: rgba(227, 169, 79, .36); --flash: rgba(227, 169, 79, .16);
    --fig-bg: #1c1b19; --fig-ink: #e2dcd1; --fig-muted: #a39b90; --fig-w1: #282622; --fig-w2: #3a362f; --fig-w3: #8d8579;
    --fig-face: #2b2824; --fig-floor: #34302a; --fig-wood: #7c5e41; --fig-wood2: #8d6c4b; --fig-linen: #2f2c28;
    --fig-shell: #20160f; --fig-belly: #a5713f; --fig-blanket: #4f6073; --fig-ochre: #d6a14a; --fig-ochre2: #9c7a3c;
    --fig-fur: #8a6c55; --fig-sky: #3c4348; --fig-fog: #4a5257; --fig-rain: #a3b3bd; --fig-drop: #59646a;
    --fab1: #c08a2f; --fab2: #5e7590; --fab3: #9a5442; --fab4: #7b8a60;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121110; --ink: #e7e2d9; --muted: #9c958b; --rule: #3a3631; --accent: #e3a94f; --accent-ink: #1b1306;
  --chrome: #1b1a18; --chrome-ink: #e7e2d9; --sel: rgba(231, 226, 217, .12); --ground: rgba(227, 169, 79, .22);
  --scan: rgba(227, 169, 79, .36); --flash: rgba(227, 169, 79, .16);
  --fig-bg: #1c1b19; --fig-ink: #e2dcd1; --fig-muted: #a39b90; --fig-w1: #282622; --fig-w2: #3a362f; --fig-w3: #8d8579;
  --fig-face: #2b2824; --fig-floor: #34302a; --fig-wood: #7c5e41; --fig-wood2: #8d6c4b; --fig-linen: #2f2c28;
  --fig-shell: #20160f; --fig-belly: #a5713f; --fig-blanket: #4f6073; --fig-ochre: #d6a14a; --fig-ochre2: #9c7a3c;
  --fig-fur: #8a6c55; --fig-sky: #3c4348; --fig-fog: #4a5257; --fig-rain: #a3b3bd; --fig-drop: #59646a;
  --fab1: #c08a2f; --fab2: #5e7590; --fab3: #9a5442; --fab4: #7b8a60;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }

#app { position: fixed; inset: 0; background: var(--paper); color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#app.booting #frame { visibility: hidden; }

/* ---------- the page */
#frame { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--mt)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--foot)); overflow: hidden; }
#flow {
  column-fill: auto; font-family: var(--serif); font-size: var(--fs); line-height: 1.5;
  text-align: justify; hyphens: auto; -webkit-hyphens: auto; font-kerning: normal;
  overflow-wrap: break-word; widows: 2; orphans: 2;
}
.para { margin: 0; text-indent: 1.1em; border-radius: 3px; }
.para.cont { text-indent: 0; }
.para.reopen::before { content: "“"; }
.para.sel { background: var(--sel); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.para.flash { background: var(--flash); }
.ph { position: relative; border-radius: 2px; transition: background-color .2s; }
.ph.scan { background: var(--scan); }
.ph.on { background: var(--ground); }
.ph.on::after {
  content: attr(data-n); position: absolute; left: -5px; top: -0.72em; min-width: 15px; height: 15px; padding: 0 3px;
  box-sizing: border-box; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font: 700 10px/15px var(--ui); text-align: center; text-indent: 0; pointer-events: none;
}
@media (prefers-reduced-motion: reduce) { .ph { transition: none; } }

.titlepage {
  box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .35em; text-align: center; text-indent: 0; break-after: column; overflow: hidden;
}
.titlepage .cover-art { height: min(32%, 15em); width: auto; margin-bottom: .9em; flex: none; }
.titlepage .bk { font-variant: small-caps; letter-spacing: .14em; font-size: 1.5em; line-height: 1.2; }
.titlepage .au { font-variant: small-caps; letter-spacing: .08em; font-size: 1.05em; }
.titlepage .tr { font-family: var(--ui); font-size: .62em; color: var(--muted); }
.titlepage .part { margin-top: 1em; font-weight: 700; font-size: 1.1em; }
.titlepage .how { margin: 1.4em 0 0; max-width: 21em; font-family: var(--ui); font-size: .64em; line-height: 1.5; color: var(--muted); text-align: center; }
.titlepage .how b { color: var(--ink); }

.endmark { break-inside: avoid; text-align: center; text-indent: 0; font-family: var(--ui); font-size: .7em; color: var(--muted); padding-top: 1.4em; line-height: 1.5; }
.endmark::before { content: ""; display: block; width: 3em; margin: 0 auto 1em; border-top: 1.5px solid var(--rule); }
.endmark p { margin: .3em 0; }

/* ---------- pictures */
.fig { margin: 0; padding: 10px 0 4px; box-sizing: border-box; display: flex; flex-direction: column; break-inside: avoid; text-indent: 0; }
.art-wrap { display: flex; justify-content: center; min-height: 0; }
.art-wrap svg { height: 100%; width: auto; max-width: 100%; display: block; border-radius: 6px; }
.fig figcaption {
  height: 24px; display: flex; justify-content: center; align-items: baseline; gap: .55em; white-space: nowrap; overflow: hidden;
  font: italic 13px/24px var(--serif); color: var(--muted);
}
.fig .tag { font: 600 11px/24px var(--ui); font-style: normal; color: var(--muted); letter-spacing: .02em; }
.fig.grounded .tag { color: var(--accent); }
.fig.imagined .ttl::after { content: " (imagined)"; }

.art { stroke-linecap: round; stroke-linejoin: round; }
.art .plate { fill: var(--fig-bg); }
.art .k { stroke: var(--fig-ink); stroke-width: 2.2; }
.art .k1 { stroke-width: 1.4; }
.art .k3 { stroke-width: 3.4; }
.art .n { fill: none; }
.art .soft { opacity: .55; }
.art .dash { stroke-dasharray: 7 6; }
.art .w1 { fill: var(--fig-w1); }
.art .w2 { fill: var(--fig-w2); }
.art .w3 { fill: var(--fig-w3); }
.art .facef { fill: var(--fig-face); }
.art .inkf { fill: var(--fig-ink); }
.art .floor { fill: var(--fig-floor); }
.art .wood { fill: var(--fig-wood); }
.art .wood2 { fill: var(--fig-wood2); }
.art .linen { fill: var(--fig-linen); }
.art .shell { fill: var(--fig-shell); }
.art .belly { fill: var(--fig-belly); }
.art .blanket { fill: var(--fig-blanket); }
.art .ochre { fill: var(--fig-ochre); }
.art .ochre2 { fill: var(--fig-ochre2); }
.art .fur { fill: var(--fig-fur); }
.art .sky { fill: var(--fig-sky); }
.art .fog { fill: var(--fig-fog); opacity: .7; }
.art .fab1 { fill: var(--fab1); }
.art .fab2 { fill: var(--fab2); }
.art .fab3 { fill: var(--fab3); }
.art .fab4 { fill: var(--fab4); }
.art .shade { fill: var(--fig-ink); opacity: .12; }
.art .sheen { stroke: var(--fig-face); stroke-width: 2.4; opacity: .35; }
.art .hem { stroke: var(--fig-face); stroke-width: 3; opacity: .55; }
.art .leg { stroke-width: 1.7; }
.art .rain { stroke: var(--fig-rain); stroke-width: 1.2; opacity: .55; }
.art .trail { stroke: var(--fig-rain); stroke-width: 1.1; opacity: .5; }
.art .drop { fill: var(--fig-drop); stroke: var(--fig-rain); stroke-width: 1; }
.art .tick { stroke-width: 1.3; }
.art .ghost { stroke-width: 2.2; stroke-dasharray: 3 4; opacity: .55; }
.art .alarmhand { stroke: var(--fig-ochre); stroke-width: 3.2; }
.art .wall { stroke: var(--fig-w3); stroke-width: 10; stroke-linecap: square; }
.art .door { stroke: var(--fig-ochre); stroke-width: 5; }
.art .lbl { fill: var(--fig-ink); font-family: var(--ui); font-size: 15px; font-weight: 700; stroke: none; }
.art .lbl.small { font-size: 13px; font-weight: 600; fill: var(--fig-muted); }
.art .lbl.num { font-size: 13px; }
.art .lbl.caps { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; fill: var(--fig-muted); }
.art .pins { display: none; }
.fig.grounded .art .pins { display: inline; }
.art .pin-c { fill: var(--accent); stroke: var(--fig-bg); stroke-width: 2.5; }
.art .pin-t { fill: var(--accent-ink); font: 700 13px var(--ui); }

/* ---------- KOReader-style chrome */
.kbtn {
  display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--chrome-ink); border-radius: 9px;
  background: var(--chrome); color: var(--chrome-ink); font: 700 14px/1 var(--ui); padding: 7px 12px; cursor: pointer;
}
.kbtn:focus-visible, #pageno:focus-visible, .pref:focus-visible, #menu button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.kbtn svg { width: 16px; height: 16px; flex: none; }
.kbtn[disabled] { opacity: .5; }

#foot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot);
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; box-sizing: content-box;
}
#illus .dots { display: none; }
#illus.working .dots { display: inline; }
#illus.working .dots i { animation: blink 1s infinite; font-style: normal; }
#illus.working .dots i:nth-child(2) { animation-delay: .2s; }
#illus.working .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #illus.working .dots i { animation: none; } }
#pageno {
  border: 0; background: none; padding: 8px 2px 8px 12px; cursor: pointer;
  font: 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums;
}

#explainBtn { position: absolute; z-index: 5; font-size: 16px; padding: 9px 18px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }

#toast {
  position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  width: max-content; max-width: min(30em, calc(100% - 32px)); box-sizing: border-box;
  border: 2px solid var(--chrome-ink); border-radius: 9px; background: var(--chrome); color: var(--chrome-ink);
  font: 14px/1.45 var(--ui); padding: 10px 14px; text-align: center; box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
}

#menu {
  position: absolute; z-index: 7; left: 0; right: 0; top: 0; background: var(--chrome); color: var(--chrome-ink);
  border-bottom: 2px solid var(--chrome-ink); padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
  display: grid; gap: 10px; font-family: var(--ui);
}
#menu .mtitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
#menu .mtitle b { font-size: 16px; }
#menu .mtitle span { font-size: 13px; color: var(--muted); }
#menu .mrow { display: flex; flex-wrap: wrap; gap: 8px; }
#menu .mrow button { border: 2px solid var(--chrome-ink); border-radius: 9px; background: var(--chrome); font: 600 14px/1 var(--ui); padding: 9px 12px; cursor: pointer; }

/* KOReader TextViewer-style window */
#sheet { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .18); }
#sheet .win {
  width: 100%; max-width: 34em; max-height: min(82%, 46em); display: flex; flex-direction: column;
  background: var(--chrome); color: var(--chrome-ink); border: 2px solid var(--chrome-ink); border-radius: 12px;
  font-family: var(--ui); box-shadow: 0 10px 40px rgba(0, 0, 0, .2); user-select: text; -webkit-user-select: text;
}
#sheet header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1.5px solid var(--rule); }
#sheet h2 { margin: 0; font-size: 16px; font-weight: 700; }
#sheet .x { border: 0; background: none; font-size: 26px; line-height: 1; padding: 4px 10px; cursor: pointer; color: var(--chrome-ink); }
#sheet .body { overflow-y: auto; padding: 6px 18px 12px; font-size: 15px; line-height: 1.55; touch-action: pan-y; }
#sheet section { margin-top: 12px; }
#sheet h3 { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#sheet p { margin: 0 0 6px; }
#sheet ul, #sheet ol { margin: 0; padding-left: 1.2em; }
#sheet li { margin: 0 0 5px; }
#sheet dl { margin: 0; }
#sheet dt { font-weight: 700; font-family: var(--serif); font-style: italic; }
#sheet dd { margin: 0 0 6px; }
#sheet .mono { font: 12px/1.6 ui-monospace, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
#sheet .ok { color: var(--accent); font-weight: 700; }
#sheet a { color: var(--accent); }
#sheet .figlink { margin-top: 14px; }
#sheet > .win > footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 18px; border-top: 1.5px solid var(--rule); }
#sheet .note { font-size: 12px; color: var(--muted); }
.pref {
  border: 0; border-radius: 6px; background: var(--ground); color: inherit; font: 700 .92em/1.2 var(--ui);
  padding: 1px 5px; cursor: pointer;
}

</style>

<div id="app" class="booting">
  <main id="frame"><div id="flow" lang="en"></div></main>

  <footer id="foot" class="ui">
    <button id="illus" class="kbtn" type="button" title="Picture this page (I)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14c1.6 0 3-.6 3.4-2.2.3-1.1-.4-2-1.4-2.1C2.6 9.6 2.2 11 2.2 12.2 2.2 13 1.6 13.6 1 14h1z" fill="currentColor"/><path d="M5.6 9.4 13.4 1.6a1.1 1.1 0 0 1 1.6 1.6L7.2 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="illusLabel">Illustrate</span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>

</div>

<script type="application/json" id="reader-data">{"meta":{"title":"Metamorphosis","author":"Franz Kafka","translator":"David Wyllie","part":"I","excerpt":"¶1–¶9 of Part I"},"paragraphs":[{"id":"p1","n":1,"text":"One morning, when Gregor Samsa woke from troubled dreams, he found himself transformed in his bed into a horrible vermin. He lay on his armour-like back, and if he lifted his head a little he could see his brown belly, slightly domed and divided by arches into stiff sections. The bedding was hardly able to cover it and seemed ready to slide off any moment. His many legs, pitifully thin compared with the size of the rest of him, waved about helplessly as he looked.","sentences":[{"a":0,"b":121,"q":false},{"a":122,"b":276,"q":false},{"a":277,"b":358,"q":false},{"a":359,"b":468,"q":false}],"phrases":[{"f":"f1","key":"bed","a":87,"b":97,"s":0,"n":1},{"f":"f1","key":"back","a":132,"b":152,"s":1,"n":2},{"f":"f1","key":"head","a":164,"b":188,"s":1,"n":3},{"f":"f1","key":"belly","a":206,"b":275,"s":1,"n":4},{"f":"f1","key":"bedding","a":277,"b":316,"s":2,"n":5},{"f":"f1","key":"legs","a":359,"b":388,"s":3,"n":6}]},{"id":"p2","n":2,"text":"“What’s happened to me?” he thought. It wasn’t a dream. His room, a proper human room although a little too small, lay peacefully between its four familiar walls. A collection of textile samples lay spread out on the table—Samsa was a travelling salesman—and above it there hung a picture that he had recently cut out of an illustrated magazine and housed in a nice, gilded frame. It showed a lady fitted out with a fur hat and fur boa who sat upright, raising a heavy fur muff that covered the whole of her lower arm towards the viewer.","sentences":[{"a":0,"b":36,"q":false},{"a":37,"b":55,"q":false},{"a":56,"b":162,"q":false},{"a":163,"b":380,"q":false},{"a":381,"b":537,"q":false}],"phrases":[{"f":"f2","key":"small","a":95,"b":113,"s":2,"n":1},{"f":"f2","key":"walls","a":142,"b":161,"s":2,"n":2},{"f":"f2","key":"samples","a":179,"b":222,"s":3,"n":3},{"f":"f2","key":"frame","a":359,"b":379,"s":3,"n":4},{"f":"f2","key":"lady","a":391,"b":435,"s":4,"n":5},{"f":"f2","key":"muff","a":461,"b":477,"s":4,"n":6}]},{"id":"p3","n":3,"text":"Gregor then turned to look out the window at the dull weather. Drops of rain could be heard hitting the pane, which made him feel quite sad. “How about if I sleep a little bit longer and forget all this nonsense”, he thought, but that was something he was unable to do because he was used to sleeping on his right, and in his present state couldn’t get into that position. However hard he threw himself onto his right, he always rolled back to where he was. He must have tried it a hundred times, shut his eyes so that he wouldn’t have to look at the floundering legs, and only stopped when he began to feel a mild, dull pain there that he had never felt before.","sentences":[{"a":0,"b":62,"q":false},{"a":63,"b":140,"q":false},{"a":141,"b":372,"q":false},{"a":373,"b":457,"q":false},{"a":458,"b":662,"q":false}],"phrases":[{"f":"f3","key":"window","a":22,"b":41,"s":0,"n":1},{"f":"f3","key":"weather","a":45,"b":61,"s":0,"n":2},{"f":"f3","key":"rain","a":63,"b":108,"s":1,"n":3}]},{"id":"p4","n":4,"text":"“Oh, God”, he thought, “what a strenuous career it is that I’ve chosen! Travelling day in and day out. Doing business like this takes much more effort than doing your own business at home, and on top of that there’s the curse of travelling, worries about making train connections, bad and irregular food, contact with different people all the time so that you can never get to know anyone or become friendly with them. It can all go to Hell!” He felt a slight itch up on his belly; pushed himself slowly up on his back towards the headboard so that he could lift his head better; found where the itch was, and saw that it was covered with lots of little white spots which he didn’t know what to make of; and when he tried to feel the place with one of his legs he drew it quickly back because as soon as he touched it he was overcome by a cold shudder.","sentences":[{"a":0,"b":71,"q":true},{"a":72,"b":102,"q":true},{"a":103,"b":418,"q":true},{"a":419,"b":442,"q":false},{"a":443,"b":852,"q":false}],"phrases":[]},{"id":"p5","n":5,"text":"He slid back into his former position. “Getting up early all the time”, he thought, “it makes you stupid. You’ve got to get enough sleep. Other travelling salesmen live a life of luxury. For instance, whenever I go back to the guest house during the morning to copy out the contract, these gentlemen are always still sitting there eating their breakfasts. I ought to just try that with my boss; I’d get kicked out on the spot. But who knows, maybe that would be the best thing for me. If I didn’t have my parents to think about I’d have given in my notice a long time ago, I’d have gone up to the boss and told him just what I think, tell him everything I would, let him know just what I feel. He’d fall right off his desk! And it’s a funny sort of business to be sitting up there at your desk, talking down at your subordinates from up there, especially when you have to go right up close because the boss is hard of hearing. Well, there’s still some hope; once I’ve got the money together to pay off my parents’ debt to him—another five or six years I suppose—that’s definitely what I’ll do. That’s when I’ll make the big change. First of all though, I’ve got to get up, my train leaves at five.”","sentences":[{"a":0,"b":38,"q":false},{"a":39,"b":105,"q":true},{"a":106,"b":137,"q":true},{"a":138,"b":186,"q":true},{"a":187,"b":355,"q":true},{"a":356,"b":426,"q":true},{"a":427,"b":484,"q":true},{"a":485,"b":693,"q":true},{"a":694,"b":723,"q":true},{"a":724,"b":926,"q":true},{"a":927,"b":1093,"q":true},{"a":1094,"b":1131,"q":true},{"a":1132,"b":1198,"q":false}],"phrases":[{"f":"f4","key":"fall","a":694,"b":723,"s":8,"n":1},{"f":"f4","key":"desk","a":764,"b":793,"s":9,"n":2},{"f":"f4","key":"talk","a":795,"b":828,"s":9,"n":3},{"f":"f4","key":"close","a":872,"b":889,"s":9,"n":4},{"f":"f4","key":"ear","a":898,"b":925,"s":9,"n":5}]},{"id":"p6","n":6,"text":"And he looked over at the alarm clock, ticking on the chest of drawers. “God in Heaven!” he thought. It was half past six and the hands were quietly moving forwards, it was even later than half past, more like quarter to seven. Had the alarm clock not rung? He could see from the bed that it had been set for four o’clock as it should have been; it certainly must have rung. Yes, but was it possible to quietly sleep through that furniture-rattling noise? True, he had not slept peacefully, but probably all the more deeply because of that. What should he do now? The next train went at seven; if he were to catch that he would have to rush like mad and the collection of samples was still not packed, and he did not at all feel particularly fresh and lively. And even if he did catch the train he would not avoid his boss’s anger as the office assistant would have been there to see the five o’clock train go, he would have put in his report about Gregor’s not being there a long time ago. The office assistant was the boss’s man, spineless, and with no understanding. What about if he reported sick? But that would be extremely strained and suspicious as in five years of service Gregor had never once yet been ill. His boss would certainly come round with the doctor from the medical insurance company, accuse his parents of having a lazy son, and accept the doctor’s recommendation not to make any claim as the doctor believed that no-one was ever ill but that many were workshy. And what’s more, would he have been entirely wrong in this case? Gregor did in fact, apart from excessive sleepiness after sleeping for so long, feel completely well and even felt much hungrier than usual.","sentences":[{"a":0,"b":71,"q":false},{"a":72,"b":100,"q":false},{"a":101,"b":227,"q":false},{"a":228,"b":257,"q":false},{"a":258,"b":374,"q":false},{"a":375,"b":455,"q":false},{"a":456,"b":540,"q":false},{"a":541,"b":563,"q":false},{"a":564,"b":759,"q":false},{"a":760,"b":990,"q":false},{"a":991,"b":1069,"q":false},{"a":1070,"b":1101,"q":false},{"a":1102,"b":1217,"q":false},{"a":1218,"b":1483,"q":false},{"a":1484,"b":1548,"q":false},{"a":1549,"b":1689,"q":false}],"phrases":[{"f":"f5","key":"clock","a":22,"b":46,"s":0,"n":1},{"f":"f5","key":"chest","a":50,"b":70,"s":0,"n":2},{"f":"f5","key":"halfpast","a":101,"b":121,"s":2,"n":3},{"f":"f5","key":"quarter","a":200,"b":226,"s":2,"n":4},{"f":"f5","key":"alarm","a":301,"b":321,"s":4,"n":5}]},{"id":"p7","n":7,"text":"He was still hurriedly thinking all this through, unable to decide to get out of the bed, when the clock struck quarter to seven. There was a cautious knock at the door near his head. “Gregor”, somebody called—it was his mother—“it’s quarter to seven. Didn’t you want to go somewhere?” That gentle voice! Gregor was shocked when he heard his own voice answering, it could hardly be recognised as the voice he had had before. As if from deep inside him, there was a painful and uncontrollable squeaking mixed in with it, the words could be made out at first but then there was a sort of echo which made them unclear, leaving the hearer unsure whether he had heard properly or not. Gregor had wanted to give a full answer and explain everything, but in the circumstances contented himself with saying: “Yes, mother, yes, thank-you, I’m getting up now.” The change in Gregor’s voice probably could not be noticed outside through the wooden door, as his mother was satisfied with this explanation and shuffled away. But this short conversation made the other members of the family aware that Gregor, against their expectations was still at home, and soon his father came knocking at one of the side doors, gently, but with his fist. “Gregor, Gregor”, he called, “what’s wrong?” And after a short while he called again with a warning deepness in his voice: “Gregor! Gregor!” At the other side door his sister came plaintively: “Gregor? Aren’t you well? Do you need anything?” Gregor answered to both sides: “I’m ready, now”, making an effort to remove all the strangeness from his voice by enunciating very carefully and putting long pauses between each, individual word. His father went back to his breakfast, but his sister whispered: “Gregor, open the door, I beg of you.” Gregor, however, had no thought of opening the door, and instead congratulated himself for his cautious habit, acquired from his travelling, of locking all doors at night even when he was at home.","sentences":[{"a":0,"b":129,"q":false},{"a":130,"b":183,"q":false},{"a":184,"b":251,"q":true},{"a":252,"b":285,"q":false},{"a":286,"b":304,"q":false},{"a":305,"b":424,"q":false},{"a":425,"b":679,"q":false},{"a":680,"b":850,"q":false},{"a":851,"b":1011,"q":false},{"a":1012,"b":1228,"q":false},{"a":1229,"b":1273,"q":false},{"a":1274,"b":1360,"q":true},{"a":1361,"b":1369,"q":false},{"a":1370,"b":1430,"q":true},{"a":1431,"b":1447,"q":true},{"a":1448,"b":1470,"q":false},{"a":1471,"b":1666,"q":false},{"a":1667,"b":1770,"q":false},{"a":1771,"b":1967,"q":false}],"phrases":[{"f":"f6","key":"bed","a":50,"b":88,"s":0,"n":1},{"f":"f6","key":"mother","a":140,"b":182,"s":1,"n":2},{"f":"f6","key":"father","a":1167,"b":1227,"s":9,"n":3},{"f":"f6","key":"sister","a":1370,"b":1403,"s":13,"n":4},{"f":"f6","key":"locked","a":1915,"b":1941,"s":18,"n":5}]},{"id":"p8","n":8,"text":"The first thing he wanted to do was to get up in peace without being disturbed, to get dressed, and most of all to have his breakfast. Only then would he consider what to do next, as he was well aware that he would not bring his thoughts to any sensible conclusions by lying in bed. He remembered that he had often felt a slight pain in bed, perhaps caused by lying awkwardly, but that had always turned out to be pure imagination and he wondered how his imaginings would slowly resolve themselves today. He did not have the slightest doubt that the change in his voice was nothing more than the first sign of a serious cold, which was an occupational hazard for travelling salesmen.","sentences":[{"a":0,"b":134,"q":false},{"a":135,"b":282,"q":false},{"a":283,"b":504,"q":false},{"a":505,"b":683,"q":false}],"phrases":[]},{"id":"p9","n":9,"text":"It was a simple matter to throw off the covers; he only had to blow himself up a little and they fell off by themselves. But it became difficult after that, especially as he was so exceptionally broad. He would have used his arms and his hands to push himself up; but instead of them he only had all those little legs continuously moving in different directions, and which he was moreover unable to control. If he wanted to bend one of them, then that was the first one that would stretch itself out; and if he finally managed to do what he wanted with that leg, all the others seemed to be set free and would move about painfully. “This is something that can’t be done in bed”, Gregor said to himself, “so don’t keep trying to do it”.","sentences":[{"a":0,"b":120,"q":false},{"a":121,"b":201,"q":false},{"a":202,"b":407,"q":false},{"a":408,"b":631,"q":false},{"a":632,"b":735,"q":false}],"phrases":[]}],"figures":[{"id":"f1","p":"p1","scene":"bed","title":"Gregor, transformed","imagined":false,"anchor":"legs","anchorSentence":3,"params":{"legs":8},"elements":[{"key":"bed","p":"p1","quote":"in his bed","n":1},{"key":"back","p":"p1","quote":"his armour-like back","n":2},{"key":"head","p":"p1","quote":"lifted his head a little","n":3},{"key":"belly","p":"p1","quote":"brown belly, slightly domed and divided by arches into stiff sections","n":4},{"key":"bedding","p":"p1","quote":"The bedding was hardly able to cover it","n":5},{"key":"legs","p":"p1","quote":"His many legs, pitifully thin","n":6}]},{"id":"f2","p":"p2","scene":"room","title":"His room","imagined":false,"anchor":"muff","anchorSentence":4,"params":{},"elements":[{"key":"small","p":"p2","quote":"a little too small","n":1},{"key":"walls","p":"p2","quote":"four familiar walls","n":2},{"key":"samples","p":"p2","quote":"textile samples lay spread out on the table","n":3},{"key":"frame","p":"p2","quote":"a nice, gilded frame","n":4},{"key":"lady","p":"p2","quote":"a lady fitted out with a fur hat and fur boa","n":5},{"key":"muff","p":"p2","quote":"a heavy fur muff","n":6}]},{"id":"f3","p":"p3","scene":"window","title":"Rain on the pane","imagined":false,"anchor":"rain","anchorSentence":1,"params":{},"elements":[{"key":"window","p":"p3","quote":"look out the window","n":1},{"key":"weather","p":"p3","quote":"the dull weather","n":2},{"key":"rain","p":"p3","quote":"Drops of rain could be heard hitting the pane","n":3}]},{"id":"f4","p":"p5","scene":"desk","title":"The boss at his high desk","imagined":true,"anchor":"ear","anchorSentence":9,"params":{},"elements":[{"key":"fall","p":"p5","quote":"He’d fall right off his desk!","n":1},{"key":"desk","p":"p5","quote":"sitting up there at your desk","n":2},{"key":"talk","p":"p5","quote":"talking down at your subordinates","n":3},{"key":"close","p":"p5","quote":"go right up close","n":4},{"key":"ear","p":"p5","quote":"the boss is hard of hearing","n":5}]},{"id":"f5","p":"p6","scene":"clock","title":"Quarter to seven","imagined":false,"anchor":"alarm","anchorSentence":4,"params":{"earlier":"6:30","now":"6:45","alarm":"4:00"},"elements":[{"key":"clock","p":"p6","quote":"the alarm clock, ticking","n":1},{"key":"chest","p":"p6","quote":"the chest of drawers","n":2},{"key":"halfpast","p":"p6","quote":"It was half past six","n":3},{"key":"quarter","p":"p6","quote":"more like quarter to seven","n":4},{"key":"alarm","p":"p6","quote":"set for four o’clock","n":5}]},{"id":"f6","p":"p7","scene":"doors","title":"Three doors, all locked","imagined":false,"anchor":"locked","anchorSentence":18,"params":{},"elements":[{"key":"bed","p":"p7","quote":"unable to decide to get out of the bed","n":1},{"key":"mother","p":"p7","quote":"a cautious knock at the door near his head","n":2},{"key":"father","p":"p7","quote":"knocking at one of the side doors, gently, but with his fist","n":3},{"key":"sister","p":"p7","quote":"At the other side door his sister","n":4},{"key":"locked","p":"p7","quote":"locking all doors at night","n":5}]}],"skips":{"p4":"¶4 is Gregor complaining about his job. The one physical detail, an itch, is too small to picture well.","p8":"¶8 is plans and excuses. Nothing happens that you could see.","p9":"¶9 is his struggle with his legs, which the picture for ¶1 already shows."},"explain":{"p1":{"gist":"Gregor Samsa wakes up and finds he has turned into a huge, insect-like creature. He is lying on a hard, shell-like back. When he lifts his head he can see his rounded brown belly and a lot of thin legs waving in the air.","context":["This is the first sentence of the story, and it gives away the shock at once. Kafka never explains how or why it happened. The story is about what happens next.","Kafka wrote it in late 1912. It was published in 1915."],"terms":[["vermin","Kafka’s German word is Ungeziefer: a general word for pests such as bugs or lice. Its old root meant an unclean animal unfit for sacrifice. He never names a species. The well-known Muir translation says “gigantic insect” instead."],["armour-like back","A hard shell, like a beetle’s."]],"why":"In 1915 Kafka asked his publisher not to draw the insect on the cover, not even from a distance. The picture here sticks to what this paragraph actually states: the back, the belly, the legs and the sliding bedding."},"p2":{"gist":"Gregor asks himself what has happened, and says it is not a dream. His room looks completely normal: small and familiar, his cloth samples spread on the table, and on the wall a magazine picture of a lady in furs that he framed himself.","context":["Right after the shock of ¶1, the ordinary room is the proof that he is awake.","The samples tell us his job: he travels around selling cloth for a company."],"terms":[["textile samples","Pieces of cloth a salesman shows to customers to take orders."],["boa","A long, thick scarf, here made of fur."],["muff","A tube of fur you push both hands into to keep them warm."]],"why":"The calm, everyday room makes the change in ¶1 feel stranger. The framed picture is one of the few things in the room that Gregor chose for himself. Some critics hear an echo of Sacher-Masoch’s 1870 novel Venus in Furs in it."},"p3":{"gist":"The rain on the window makes him sad. He tries to go back to sleep on his right side, as he always does, but his new rounded back keeps rocking him over. After about a hundred tries he gives up, feeling a dull ache in his side he has never felt before.","context":["The “armour-like back” from ¶1 is why he can’t turn over: he rolls back like a beetle.","He still thinks like his old self. His plan is to sleep a bit more and “forget all this nonsense”."],"terms":[["dull weather","Grey and overcast."],["floundering","Moving clumsily, struggling."]],"why":"The narration stays flat and practical while something impossible is happening. That deadpan tone is a large part of Kafka’s style."},"p4":{"gist":"Instead of panicking about his body, Gregor complains about his job: constant travel, worrying about trains, bad meals, never getting close to anyone. Then he notices an itchy patch on his belly covered in little white spots. He touches it with a leg and shudders.","context":["¶2 told us he is a travelling salesman. Here we hear how much he hates it.","He now uses one of the thin legs from ¶1 the way he used to use a hand."],"terms":[["strenuous","Exhausting."],["the curse of travelling","The misery of always being on the road."]],"why":"His job is the first thing he worries about, even now. That tells you what Gregor’s life has been like: work comes first."},"p5":{"gist":"He imagines quitting and telling his boss exactly what he thinks, but he can’t. His parents owe the boss money, and he needs five or six more years to pay it off. Then he remembers that his train leaves at five.","context":["The debt explains the misery of ¶4: he is stuck in this job for his family.","The boss sits at a high desk and talks down to his staff. Gregor pictures him falling off it."],"terms":[["copy out the contract","Write out a clean copy of the orders he has taken."],["subordinates","Staff who work under you."],["hard of hearing","Partly deaf."]],"why":"Gregor is paying off his parents’ debt himself. Who depends on whom in this family is a question the story keeps coming back to."},"p6":{"gist":"He looks at the alarm clock: it is already a quarter to seven. The alarm was set for four and must have rung, but he slept through it. He has missed the five o’clock train. The next one leaves at seven and his samples aren’t even packed. He thinks about calling in sick, but the firm would send a doctor who believes nobody is ever really ill.","context":["In ¶5 he said his train leaves at five, so he is now almost two hours late.","In five years of work he has never been ill once, so a sick call would look suspicious."],"terms":[["chest of drawers","A dresser."],["office assistant","The firm’s junior employee who waited at the station and will report him."],["medical insurance company","The health insurer. Its doctor would check whether he is really sick."],["workshy","Lazy, avoiding work."]],"why":"Kafka himself worked at an accident insurance institute in Prague from 1908, so he knew this world of reports, doctors and suspicion from the inside."},"p7":{"gist":"At a quarter to seven his mother knocks at the door near his head. When he answers, his voice comes out with a strange squeak in it. His father knocks at one side door and his sister calls through the other. He says he is getting up, but he keeps all the doors locked.","context":["His room has three doors, one to each part of the flat, so his family can surround him without seeing him.","Locking every door at night is a habit from staying in hotels as a travelling salesman (¶2, ¶4)."],"terms":[["plaintively","Sadly, pleadingly."],["enunciating","Pronouncing each word very clearly."]],"why":"This is his first contact with his family since the change, and nobody can see him. The locked doors buy him time and also keep him apart from them."},"p8":{"gist":"He wants to get up calmly, get dressed and eat breakfast before deciding anything. He tells himself that the strange voice is just the start of a bad cold.","context":["This is how he explains away the squeaking voice from ¶7.","He even blames the cold on his job (¶4): it is an “occupational hazard” of travelling."],"terms":[["occupational hazard","A risk that comes with a particular job."]],"why":"Gregor keeps finding ordinary explanations for something that is not ordinary. Watching him do it is both funny and sad."},"p9":{"gist":"The covers slide off easily, but getting up is hard. He is very wide, and instead of arms he has lots of small legs that all move on their own. When he bends one, another stretches out. He decides it can’t be done in bed.","context":["The “many legs, pitifully thin” from ¶1 are now the problem: he can’t control them.","He talks to himself like a coach: “so don’t keep trying to do it”."],"terms":[["exceptionally broad","Very wide."]],"why":"Kafka turns a simple action, getting out of bed, into a long struggle. The exact detail about each leg makes an impossible situation feel physical."}},"fingerprints":{"f1":"5ece7191","f2":"47ef0169","f3":"b885cee4","f4":"1717785a","f5":"c63d66bf","f6":"19b8b18e"}}</script>
<script>
/* Deterministic SVG illustration engine.
   Art.render(spec) -> SVG markup. The same spec always gives byte-identical
   markup: there is no Math.random and no clock. Texture that looks random (rain,
   leg angles, fabric) comes from a PRNG seeded by the figure id, and every
   coordinate is rounded to 0.1 before it is written out.
   Each drawn element is a <g data-el="key"> matching an element of the spec,
   and each element has a numbered pin that the reader shows on request. */
const Art = (() => {
  'use strict';

  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const n = v => { const r = Math.round(v * 10) / 10; return Object.is(r, -0) ? '0' : String(r); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rad = d => d * Math.PI / 180;
  // Angle in degrees clockwise from 12 o'clock, like a clock hand.
  const polar = (cx, cy, r, deg) => [cx + r * Math.sin(rad(deg)), cy - r * Math.cos(rad(deg))];
  const P = (x, y) => n(x) + ',' + n(y);
  const g = (key, body) => `<g class="el" data-el="${key}">${body}</g>`;
  const stroke = (d, cls = '') => `<path class="k n ${cls}" d="${d}"/>`;

  // ---------------------------------------------------------------- ¶1 bed
  function bed(p, r) {
    const out = [], pins = {};
    out.push('<rect class="plate" width="480" height="320" rx="8"/>');
    out.push('<rect class="w1" y="286" width="480" height="34"/>' + stroke('M0,286 H480', 'k1'));
    out.push('<ellipse class="shade" cx="252" cy="291" rx="196" ry="5"/>');

    out.push(g('bed',
      '<rect class="wood k" x="98" y="250" width="12" height="38"/>' +
      '<rect class="wood k" x="398" y="250" width="12" height="38"/>' +
      '<rect class="wood k" x="52" y="112" width="40" height="176" rx="12"/>' +
      stroke('M72,130 V272', 'k1') +
      '<rect class="wood k" x="414" y="168" width="30" height="120" rx="9"/>' +
      '<rect class="wood k" x="88" y="236" width="330" height="18" rx="3"/>' +
      '<rect class="linen k" x="88" y="206" width="330" height="30" rx="9"/>' +
      '<path class="linen k" d="M98,200 Q100,184 140,184 Q182,184 184,198 Q182,210 140,210 Q100,210 98,200 Z"/>'));
    pins.bed = [72, 98];

    // Body: an ellipse lying on its back. Lower band = shell, upper dome = belly.
    const cx = 268, cy = 172, rx = 116, ry = 38, rimY = 180;
    const half = rx * Math.sqrt(1 - ((rimY - cy) / ry) ** 2);
    const xL = cx - half, xR = cx + half, span = xR - xL;
    const yTop = x => cy - ry * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2));
    const yRim = x => { const t = (x - xL) / span; return rimY + 32 * t * (1 - t); };

    out.push(g('back',
      `<path class="shell k" d="M${P(xL, rimY)} A${rx},${ry} 0 0 0 ${P(xR, rimY)} Q${P(cx, rimY + 16)} ${P(xL, rimY)} Z"/>` +
      stroke(`M${P(xL + 22, 193)} Q${P(cx, 214)} ${P(xR - 22, 193)}`, 'sheen')));
    pins.back = [236, 216];

    let arches = '';
    for (let i = 1; i <= 8; i++) {
      const x = xL + i * span / 9, y0 = yRim(x), y1 = yTop(x - 3) + 2;
      arches += stroke(`M${P(x, y0)} Q${P(x - 9, (y0 + y1) / 2)} ${P(x - 3, y1)}`, 'k1');
    }
    out.push(g('belly',
      `<path class="belly k" d="M${P(xL, rimY)} Q${P(cx, rimY + 16)} ${P(xR, rimY)} A${rx},${ry} 0 1 0 ${P(xL, rimY)} Z"/>` +
      arches + stroke(`M${P(xL + 34, 151)} Q${P(cx, 129)} ${P(xR - 40, 150)}`, 'sheen')));
    pins.belly = [256, 158];

    out.push(g('head',
      '<ellipse class="shell k" cx="141" cy="166" rx="17" ry="14" transform="rotate(-28 141 166)"/>' +
      '<circle class="inkf" cx="134" cy="160" r="2.4"/>' +
      stroke('M131,155 Q118,137 99,131 M127,161 Q111,151 92,152', 'k1') +
      stroke('M127,173 l-7,4 M130,177 l-5,7', 'k1')));
    pins.head = [112, 190];

    // Legs: thin two-segment legs waving from the dome; angles from the PRNG.
    const count = p.legs || 8;
    let legs = '';
    const tips = [];
    for (let i = 0; i < count; i++) {
      const x = 170 + i * 21, by = yTop(x) + 5;
      const a1 = -90 + (i - (count - 1) / 2) * 7 + (r() - 0.5) * 26;
      const l1 = 24 + r() * 10;
      const kx = x + l1 * Math.cos(rad(a1)), ky = by + l1 * Math.sin(rad(a1));
      const a2 = a1 + (i % 2 ? 40 : -40) + (r() - 0.5) * 20;
      const l2 = 20 + r() * 10;
      const fx = kx + l2 * Math.cos(rad(a2)), fy = ky + l2 * Math.sin(rad(a2));
      const cx2 = fx + 6 * Math.cos(rad(a2 + 70)), cy2 = fy + 6 * Math.sin(rad(a2 + 70));
      legs += stroke(`M${P(x, by)} L${P(kx, ky)} L${P(fx, fy)} L${P(cx2, cy2)}`, 'leg');
      tips.push([fx, fy]);
    }
    for (const i of [0, 3, 6]) {
      if (!tips[i]) continue;
      const [fx, fy] = tips[i];
      legs += stroke(`M${P(fx + 9, fy - 6)} q5,5 0,11 M${P(fx - 9, fy - 6)} q-5,5 0,11`, 'k1 soft');
    }
    out.push(g('legs', legs));
    pins.legs = [158, 92];

    const by0 = yTop(322);
    out.push(g('bedding',
      `<path class="blanket k" d="M${P(322, by0)} C345,136 372,150 386,176 L412,206 L418,266 Q372,284 318,270 Q306,236 312,206 Q314,170 ${P(322, by0)} Z"/>` +
      stroke('M322,257 Q370,272 414,254', 'hem') +
      stroke('M342,152 Q352,200 344,262 M372,164 Q386,212 388,272', 'k1 soft') +
      stroke('M398,286 l9,7 M378,288 l9,7', 'k1')));
    pins.bedding = [394, 232];
    return { body: out.join(''), pins };
  }

    let weather = `<rect class="sky" x="${ox}" y="${oy}" width="${ow}" height="${oh}"/>`;
    weather += '<path class="fog" d="M114,92 Q170,76 226,90 T366,84 V122 Q300,112 240,122 T114,118 Z"/>';
    weather += '<path class="fog" d="M114,190 Q180,176 250,192 T366,186 V254 H114 Z"/>';
    let streaks = '';
    for (let i = 0; i < 70; i++) {
      const x = ox + r() * ow, y = oy + r() * oh, len = 10 + r() * 14;

    out.push(g('weather', `<g clip-path="url(#${uid}-g)">${weather}</g>`));

    // Drops on the glass, kept off the mullions.
    let drops = '';
    const panes = [[ox, oy, 121, 100], [245, oy, 121, 100], [ox, 154, 121, 100], [245, 154, 121, 100]];

  // ---------------------------------------------------------------- ¶6 clock
  function clock(p) {
    const out = [], pins = {};
    const t = s => { const [h, m] = String(s).split(':').map(Number); return { hour: ((h % 12) + m / 60) * 30, min: m * 6 }; };
    const now = t(p.now || '6:45'), earlier = t(p.earlier || '6:30'), alarm = t(p.alarm || '4:00');
    const cx = 240, cy = 112;
    out.push('<rect class="plate" width="480" height="320" rx="8"/>');
    out.push('<rect class="w1" y="290" width="480" height="30"/>' + stroke('M0,290 H480', 'k1'));

    out.push(g('chest',
      '<rect class="wood k" x="100" y="180" width="280" height="12" rx="2"/>' +
      '<rect class="wood k" x="112" y="192" width="256" height="92"/>' +
      [200, 229, 258].map(y => `<rect class="wood2 k k1" x="122" y="${y}" width="236" height="24" rx="2"/>` +
        `<circle class="ochre k k1" cx="190" cy="${y + 12}" r="3.5"/><circle class="ochre k k1" cx="290" cy="${y + 12}" r="3.5"/>`).join('') +
      '<rect class="wood k" x="118" y="284" width="14" height="6"/><rect class="wood k" x="348" y="284" width="14" height="6"/>'));
    pins.chest = [384, 238];

    let face = '';
    for (let i = 0; i < 60; i++) {
      const [x1, y1] = polar(cx, cy, 46, i * 6), [x2, y2] = polar(cx, cy, i % 5 ? 42.5 : 38, i * 6);
      face += `M${P(x1, y1)} L${P(x2, y2)} `;
    }
    const nums = [[12, 0], [3, 90], [6, 180], [9, 270]].map(([v, a]) => {
      const [x, y] = polar(cx, cy, 29, a);
      return `<text class="lbl num" x="${n(x)}" y="${n(y + 5)}" text-anchor="middle">${v}</text>`;
    }).join('');
    const [b1x, b1y] = polar(cx, cy, 58, -36), [b2x, b2y] = polar(cx, cy, 58, 36);
    out.push(g('clock',
      stroke(`M${P(cx - 22, cy + 50)} L${P(cx - 32, cy + 68)} M${P(cx + 22, cy + 50)} L${P(cx + 32, cy + 68)}`, 'k3') +
      `<circle class="w3 k" cx="${n(b1x)}" cy="${n(b1y)}" r="16"/><circle class="w3 k" cx="${n(b2x)}" cy="${n(b2y)}" r="16"/>` +
      stroke(`M${P(cx, cy - 56)} V${n(cy - 70)}`, 'k3') + `<circle class="w3 k" cx="${cx}" cy="${cy - 72}" r="4"/>` +
      `<circle class="w3 k" cx="${cx}" cy="${cy}" r="56"/><circle class="facef k k1" cx="${cx}" cy="${cy}" r="48"/>` +
      `<path class="k n tick" d="${face.trim()}"/>` + nums +
      stroke('M158,82 q-8,10 0,20 M148,76 q-12,16 0,32 M322,82 q8,10 0,20 M332,76 q12,16 0,32', 'k1 soft')));
    pins.clock = [312, 50];

    const hand = (deg, len, cls) => { const [x, y] = polar(cx, cy, len, deg); return stroke(`M${P(cx, cy)} L${P(x, y)}`, cls); };
    const [g1x, g1y] = polar(cx, cy, 43, earlier.min + 6), [g2x, g2y] = polar(cx, cy, 43, now.min - 6);
    out.push(g('halfpast',
      hand(earlier.min, 38, 'ghost') +
      stroke(`M${P(g1x, g1y)} A43,43 0 0 1 ${P(g2x, g2y)}`, 'k1 soft') +
      (() => { const [ax, ay] = polar(cx, cy, 43, now.min - 6), [bx, by] = polar(cx, cy, 39, now.min - 13), [dx, dy] = polar(cx, cy, 47, now.min - 13);
        return stroke(`M${P(bx, by)} L${P(ax, ay)} L${P(dx, dy)}`, 'k1 soft'); })()));
    pins.halfpast = [262, 176];

    const [atx, aty] = polar(cx, cy, 34, alarm.hour);
    out.push(g('alarm',
      stroke(`M${P(cx, cy)} L${P(atx, aty)}`, 'alarmhand') +
      `<circle class="ochre k k1" cx="${n(atx)}" cy="${n(aty)}" r="4"/>`));
    pins.alarm = [290, 148];

    out.push(g('quarter',
      hand(now.hour, 25, 'k3') + hand(now.min, 40, 'k') + `<circle class="inkf" cx="${cx}" cy="${cy}" r="4"/>`));
    pins.quarter = [182, 126];
    return { body: out.join(''), pins };
  }
